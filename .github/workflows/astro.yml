name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    build:
        name: Build and Deploy
        runs-on: ubuntu-latest
        steps:
            - name: Checkout your repository
              uses: actions/checkout@v4

            - name: Install, build, and upload Astro site
              uses: withastro/action@v6
              # The action automatically detects your package manager (npm, pnpm, bun, yarn)
              # Ensure your project's lockfile is committed to Git!
